name: Android Production Build (EAS)

on:
  # Manual trigger from GitHub Actions UI
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profile"
        type: choice
        default: production
        options:
          - production
          - preview

  # Auto-trigger on every push to main.
  # We intentionally do NOT use a `paths:` filter — Emergent's "Save to GitHub"
  # sometimes batches commits in ways that miss the filter. Easier to just
  # build on every push and let users cancel from the Actions UI if needed.
  push:
    branches: [main]

concurrency:
  group: eas-android-build
  # Cancel any older queued build when a newer commit arrives — keeps queue clean
  cancel-in-progress: true

jobs:
  build:
    name: EAS Android Build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: yarn install

      - name: Write Google Play service account JSON
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
        run: |
          if [ -z "$GOOGLE_SERVICE_ACCOUNT_KEY" ]; then
            echo "::warning::GOOGLE_SERVICE_ACCOUNT_KEY secret is empty — auto-submit will be skipped"
          else
            printf '%s' "$GOOGLE_SERVICE_ACCOUNT_KEY" > google-play-service-account.json
            echo "Service account file written ($(wc -c < google-play-service-account.json) bytes)"
          fi

      - name: Trigger EAS build (Android, production) + auto-submit
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          PROFILE="${{ github.event.inputs.profile || 'production' }}"
          AUTO_SUBMIT_FLAG=""
          if [ -f google-play-service-account.json ] && [ "$PROFILE" = "production" ]; then
            AUTO_SUBMIT_FLAG="--auto-submit"
            echo "Auto-submit enabled (track=internal)"
          fi
          echo "Starting EAS build with profile: $PROFILE $AUTO_SUBMIT_FLAG"
          eas build \
            --platform android \
            --profile "$PROFILE" \
            $AUTO_SUBMIT_FLAG \
            --non-interactive \
            --no-wait

      - name: Print dashboard link
        run: |
          echo "::notice title=EAS Build Started::Check status at https://expo.dev/accounts/levkazaryan/projects/eilatush/builds"

      - name: Notify backend of new app version
        # Reads `version` from app.json and POSTs it to /api/admin/version so
        # the in-app "update available" prompt knows the new latest version.
        # The build is `--no-wait`, but updating the version flag immediately
        # is fine — users only get the prompt once they actually have the new
        # APK on their device, and the modal compares against this number.
        env:
          BACKEND_URL: ${{ secrets.EILATUSH_BACKEND_URL }}
          ADMIN_PASSWORD: ${{ secrets.EILATUSH_ADMIN_PASSWORD }}
        run: |
          if [ -z "$BACKEND_URL" ] || [ -z "$ADMIN_PASSWORD" ]; then
            echo "::warning::EILATUSH_BACKEND_URL or EILATUSH_ADMIN_PASSWORD secret missing — skipping version notify"
            exit 0
          fi
          VERSION=$(node -p "require('./app.json').expo.version")
          echo "Notifying backend of new latest version: $VERSION"
          # Build the JSON body with jq to safely escape the password
          BODY=$(jq -nc \
            --arg pw "$ADMIN_PASSWORD" \
            --arg v  "$VERSION" \
            '{password:$pw, latest_version:$v, force:false}')
          HTTP_CODE=$(curl -sS -o /tmp/version_resp.json -w "%{http_code}" \
            -X POST "$BACKEND_URL/api/admin/version" \
            -H "Content-Type: application/json" \
            -d "$BODY" || echo "000")
          echo "Backend response ($HTTP_CODE):"
          cat /tmp/version_resp.json || true
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::warning::Version notify failed with HTTP $HTTP_CODE"
          fi
