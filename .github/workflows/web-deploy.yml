name: Web PWA Deploy (Hostinger FTP)

on:
  # Manual trigger from GitHub Actions UI
  workflow_dispatch:

  # Auto-trigger on every push to main.
  # No paths filter — Emergent's "Save to GitHub" sometimes batches files
  # in ways that miss strict path filters. Better to always build + deploy.
  push:
    branches: [main]

concurrency:
  group: web-deploy-hostinger
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build PWA & Deploy to Hostinger
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: yarn install

      - name: Build PWA (static web export)
        env:
          # Backend API the production website will talk to
          EXPO_PUBLIC_BACKEND_URL: ${{ secrets.EILATUSH_BACKEND_URL }}
          # Public site URL — used for share links, canonical, OG, etc.
          EXPO_PUBLIC_APP_URL: https://eilatush.app
        run: |
          if [ -z "$EXPO_PUBLIC_BACKEND_URL" ]; then
            echo "::warning::EILATUSH_BACKEND_URL secret missing — falling back to baked-in URL in api.ts"
          fi
          yarn build:web
          echo "----- dist contents -----"
          ls -la dist | head -30
          echo "Total files: $(find dist -type f | wc -l)"
          echo "Total size:  $(du -sh dist | cut -f1)"

      - name: Deploy to Hostinger via FTPS (with retry)
        # Hostinger has a known issue where the FTPS DATA channel breaks even when
        # the CONTROL channel works. Fix: keep control channel encrypted (auth is safe)
        # but disable encryption on data channel so file transfers actually complete.
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 12
          max_attempts: 3
          retry_wait_seconds: 60
          command: |
            cd "${{ github.workspace }}"
            sudo apt-get update -qq && sudo apt-get install -qq -y lftp >/dev/null
            REMOTE_DIR="${{ secrets.HOSTINGER_FTP_REMOTE_PATH }}"
            REMOTE_DIR="${REMOTE_DIR:-/public_html/}"
            echo "─── Uploading frontend/dist/ → ${REMOTE_DIR} ───"
            echo "File count: $(find frontend/dist -type f | wc -l)"
            echo "Total size: $(du -sh frontend/dist | cut -f1)"

            lftp -e "
              debug -o /tmp/lftp.log 3;
              set ssl:verify-certificate no;
              set ssl:check-hostname no;
              set ftp:ssl-allow yes;
              set ftp:ssl-force yes;
              set ftp:ssl-protect-data no;
              set ftp:ssl-protect-list yes;
              set ftp:passive-mode true;
              set ftp:use-mlsd false;
              set ftp:prefer-epsv false;
              set net:timeout 60;
              set net:max-retries 3;
              set net:reconnect-interval-base 15;
              set net:reconnect-interval-max 90;
              set net:persist-retries 5;
              set xfer:clobber on;
              set mirror:use-pget-n 1;
              set mirror:parallel-transfer-count 1;
              set mirror:set-permissions no;
              open -u '${{ secrets.HOSTINGER_FTP_USERNAME }}','${{ secrets.HOSTINGER_FTP_PASSWORD }}' ftp://${{ secrets.HOSTINGER_FTP_HOST }};
              mirror -R --no-perms --verbose=1 --exclude-glob .git* --exclude-glob .DS_Store --exclude-glob .ftpquota frontend/dist/ ${REMOTE_DIR};
              bye;
            " || {
              EXITCODE=$?
              echo "─── LFTP DEBUG LOG (last 80 lines) ───"
              tail -n 80 /tmp/lftp.log 2>/dev/null || echo "(no debug log)"
              echo "::error::lftp exited with code $EXITCODE — see debug log above"
              exit $EXITCODE
            }
            echo "::notice::Deploy succeeded → https://eilatush.app"

      - name: Done
        run: |
          echo "::notice title=Web Deploy Complete::🐬 https://eilatush.app"
