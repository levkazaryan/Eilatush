name: Web PWA Deploy (Hostinger Git Auto-Deploy)

# Builds the PWA and pushes it to a separate "web-dist" branch.
# Hostinger then pulls that branch via webhook (no FTP needed — bypasses IP blocks).

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: web-deploy-hostinger
  cancel-in-progress: true

permissions:
  contents: write   # Required to push to the deploy branch

jobs:
  build-and-publish:
    name: Build PWA & Publish to deploy branch
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # Need full history to push to other branches
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: yarn install --frozen-lockfile
        working-directory: frontend

      - name: Build PWA (static web export)
        working-directory: frontend
        env:
          EXPO_PUBLIC_BACKEND_URL: ${{ secrets.EILATUSH_BACKEND_URL }}
          EXPO_PUBLIC_APP_URL: https://eilatush.app
        run: |
          if [ -z "$EXPO_PUBLIC_BACKEND_URL" ]; then
            echo "::warning::EILATUSH_BACKEND_URL secret missing — using baked-in URL in api.ts"
          fi
          yarn build:web
          echo "----- dist contents -----"
          ls -la dist | head -30
          echo "Total files: $(find dist -type f | wc -l)"
          echo "Total size:  $(du -sh dist | cut -f1)"

      - name: Publish dist/ to web-dist branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/dist
          publish_branch: web-dist
          force_orphan: true        # Each deploy = fresh single-commit branch (no history bloat)
          enable_jekyll: false      # Skip Jekyll processing (we're a static SPA)
          user_name: "eilatush-bot"
          user_email: "deploy@eilatush.app"
          commit_message: "deploy: ${{ github.event.head_commit.message || 'manual deploy' }} (${{ github.sha }})"

      - name: Notify Hostinger to pull
        # If you set up a Hostinger Git webhook URL, paste it as a GitHub Secret
        # named HOSTINGER_DEPLOY_WEBHOOK. If empty, this step skips silently.
        env:
          WEBHOOK_URL: ${{ secrets.HOSTINGER_DEPLOY_WEBHOOK }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::notice::HOSTINGER_DEPLOY_WEBHOOK secret not set — Hostinger will need a manual pull"
            echo "Set it up later: hPanel → eilatush.app → Advanced → Git → copy webhook URL → add as GitHub Secret"
            exit 0
          fi
          echo "Triggering Hostinger deploy webhook..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$WEBHOOK_URL")
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "::notice::Hostinger webhook responded $HTTP_CODE — deploy in progress on Hostinger"
          else
            echo "::warning::Hostinger webhook returned $HTTP_CODE — pull manually from hPanel"
          fi

      - name: Done
        run: |
          echo "::notice title=Built & Pushed::Built PWA → branch 'web-dist'"
          echo "::notice title=Next::Hostinger will pull from 'web-dist' branch into public_html/"
          echo "::notice title=Live URL::https://eilatush.app"
